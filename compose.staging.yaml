# Nexora STAGING overlay.
#
#   scripts/env/nexora-compose.sh staging up -d
#
# Staging is production-like: the same immutable images production will run,
# validated against its own database, its own secrets, its own volumes, and
# its own hostname - with test organizations and test devices only.
#
# The point of staging is that a release can be exercised end to end without
# any component of it being shared with the customer stack. Everything below
# exists to guarantee "without any component shared".

name: nexora-staging

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?staging POSTGRES_DB must come from /etc/nexora/env/staging.env}
      POSTGRES_USER: ${POSTGRES_USER:?staging POSTGRES_USER must come from /etc/nexora/env/staging.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging POSTGRES_PASSWORD must come from /etc/nexora/env/staging.env}

  migrate:
    build: !reset null
    image: ${NEXORA_IMAGE_MIGRATE:?set NEXORA_IMAGE_MIGRATE to the release candidate tag}
    pull_policy: never

  api:
    build: !reset null
    image: ${NEXORA_IMAGE_API:?set NEXORA_IMAGE_API to the release candidate tag}
    pull_policy: never
    environment:
      NEXORA_ENV: staging
      NEXORA_RELEASE: ${NEXORA_RELEASE:-unpinned-staging}
      API_BASE_URL: https://nexora-staging.design.local/api
      CORS_ALLOWED_ORIGINS: https://nexora-staging.design.local
      REMOTE_COMMANDS_ENABLED: ${REMOTE_COMMANDS_ENABLED:-false}

  maintenance:
    build: !reset null
    image: ${NEXORA_IMAGE_API:?set NEXORA_IMAGE_API to the release candidate tag}
    pull_policy: never

  notification-worker:
    build: !reset null
    image: ${NEXORA_IMAGE_API:?set NEXORA_IMAGE_API to the release candidate tag}
    pull_policy: never

  web:
    build: !reset null
    image: ${NEXORA_IMAGE_WEB:?set NEXORA_IMAGE_WEB to the release candidate tag}
    pull_policy: never
    # Staging has its own dedicated VM, so it binds the same ports production
    # does and exercises the identical URL shape. The former 8081/8444 offsets
    # only existed to avoid a port collision on a shared host; that design is
    # obsolete and is deliberately not retained as an alternate staging mode.
    ports: !override
      - "${NEXORA_HTTP_PORT:-80}:80"
      - "${NEXORA_HTTPS_PORT:-443}:443"
    # On a dedicated staging VM the entire filesystem belongs to staging, so
    # the server certificate lives at the standard /etc/nexora/pki/server path
    # (see docs/staging-bootstrap.md §8). The former /etc/nexora/pki/staging
    # subdirectory only existed to avoid colliding with production's PKI on a
    # shared host. The key/cert there are staging-specific and are never copied
    # from production; only the internal CA is shared, as signing authority.
    #
    # The downloads root stays staging-only: staging must never be able to
    # serve - or overwrite - the customer-visible Agent package.
    volumes: !override
      - /etc/nexora/pki/server:/etc/nexora/pki/server:ro
      - /srv/nexora/staging/downloads:/usr/share/nginx/downloads:ro
