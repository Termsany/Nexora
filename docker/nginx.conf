server {
    client_max_body_size 4m;
    listen 80;
    server_name _;

    # Used by the container healthcheck only; not part of the app surface.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nexora/pki/server/nexora.design.local.crt;
    ssl_certificate_key /etc/nexora/pki/server/nexora.design.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Remote Desktop session WebSockets. A more specific location than /api/ so
    # only these two paths get upgrade handling; every other /api/ request keeps
    # the plain proxy behaviour below, unchanged.
    #
    # Two paths, both authenticated by the gateway before the handshake
    # completes: the browser viewer (session cookie + one-time viewer token)
    # and the Agent channel (device credential + single-use channel token). No
    # new external port is opened - this is the same 443 listener - and the
    # Agent is not exposed: it dials out to this endpoint, nothing dials in.
    location ~ ^/api/v1/(remote-desktop/sessions/[0-9a-f-]+/viewer|agent/remote-desktop/[0-9a-f-]+/channel)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nexora_ws_upstream "api:3001";
        proxy_pass http://$nexora_ws_upstream;

        # Upgrade requires HTTP/1.1; without these three lines nginx strips the
        # handshake and the socket never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A desktop stream is long-lived and can be quiet while the screen is
        # static, so the default 60s read timeout would drop healthy sessions.
        # The gateway still enforces its own 30 minute deadline and idle sweep,
        # so this does not extend how long a session may actually live.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;

        # Frames must reach the viewer as they are produced.
        proxy_buffering off;
    }

    location /api/ {
        # Resolve the API container through Docker's embedded DNS on every
        # request instead of caching the IP from the first lookup. Without this,
        # nginx pins the API container's IP at worker start and returns 502 for
        # up to a full `web` restart after the API container is recreated
        # (DISK-01 / PR-04C confirmed this failure mode). The `set` + variable
        # in proxy_pass is what forces per-request re-resolution; `valid=10s`
        # bounds how long a stale record can linger.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nexora_api_upstream "api:3001";
        proxy_pass http://$nexora_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A recreated API container is briefly unresolvable/refusing; retry the
        # next upstream resolution rather than surfacing a hard 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }

    # Windows Agent pilot package downloads. Read-only static files bind-mounted
    # from the host (pilot/downloads/) - never baked into this image, so Agent
    # releases can be updated independently of the web image. Directory listing
    # is explicitly disabled: the artifact URL must be known (e.g. via the
    # Administration UI) rather than browsable.
    location = /downloads/nexora-agent-pilot.zip {
        alias /usr/share/nginx/downloads/nexora-agent-pilot.zip;
        add_header Content-Type application/zip always;
        add_header Content-Disposition 'attachment; filename="nexora-agent-pilot.zip"' always;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
