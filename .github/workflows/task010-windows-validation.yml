name: Task 010 Windows Runtime Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "agent/**"
      - "scripts/windows/task010-runtime-validation.ps1"
      - "scripts/windows/upgrade-agent.ps1"
      - "docs/task010-windows-runner.md"
      - "docs/task010-agent-upgrade-runbook.md"
      - ".github/workflows/task010-windows-validation.yml"

permissions:
  contents: read

jobs:
  windows-runtime-validation:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show runtime information
        shell: powershell
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          $PSVersionTable
          dotnet --info

      - name: Verify Task 010 validation files
        shell: powershell
        run: |
          if (-not (Test-Path ".\scripts\windows\task010-runtime-validation.ps1")) {
            throw "Missing scripts/windows/task010-runtime-validation.ps1"
          }

          if (-not (Test-Path ".\docs\task010-windows-runner.md")) {
            throw "Missing docs/task010-windows-runner.md"
          }

      - name: Verify dedicated Task 010 tests exist
        shell: powershell
        run: |
          if (-not (Get-ChildItem .\agent\Nexora.Agent.Tests -Recurse -Filter *.cs | Select-String -Pattern 'Task010_')) { throw "No Task010 acceptance tests found" }

      - name: Run Task 010 Windows runtime validation
        shell: powershell
        run: |
          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".\scripts\windows\task010-runtime-validation.ps1"

      # Job logs and run artifacts both require repository admin rights to read
      # through the API, so a failure here is otherwise opaque to anyone without
      # them. Re-emit each failed test as a workflow error annotation, which is
      # readable without admin. Diagnostics only: this asserts nothing and
      # cannot turn a failing run green.
      - name: Report failing Task 010 tests
        if: failure()
        shell: powershell
        run: |
          $trx = ".\artifacts\task010-windows-validation\task010-agent.trx"
          if (-not (Test-Path $trx)) { Write-Host "::error::No TRX produced - the suite did not run to completion."; exit 0 }
          [xml]$xml = Get-Content $trx
          $all = @($xml.TestRun.Results.UnitTestResult)
          $bad = @($all | Where-Object outcome -ne 'Passed')
          Write-Host "::error::Task010 results: $($all.Count) total, $(@($all | Where-Object outcome -eq 'Passed').Count) passed, $($bad.Count) not passed"
          foreach ($t in $bad) {
            $msg = ($t.Output.ErrorInfo.Message -replace '\s+', ' ')
            if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
            Write-Host "::error::[$($t.outcome)] $($t.testName) :: $msg"
          }

      - name: Publish Agent self-contained win-x64
        shell: powershell
        run: |
          dotnet publish `
            ".\agent\Nexora.Agent\Nexora.Agent.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ".\artifacts\nexora-agent-win-x64"

      - name: Validate Agent artifact
        shell: powershell
        run: |
          $exe = ".\artifacts\nexora-agent-win-x64\nexora-agent.exe"

          if (-not (Test-Path $exe)) {
            throw "nexora-agent.exe was not produced"
          }

          Get-Item $exe | Select-Object FullName, Length, LastWriteTime
          if (-not (Test-Path ".\artifacts\task010-windows-validation\task010-agent.trx")) { throw "Missing Task010 TRX" }
          if (-not (Select-String -Path ".\artifacts\task010-windows-validation\task010-agent.trx" -Pattern "Task010_")) { throw "TRX has no Task010 tests" }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task010-windows-validation
          path: |
            artifacts/
            task010-windows-validation.log
          if-no-files-found: warn
