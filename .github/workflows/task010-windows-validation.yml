name: Task 010 Windows Runtime Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "agent/**"
      - "scripts/windows/task010-runtime-validation.ps1"
      - "scripts/windows/upgrade-agent.ps1"
      - "docs/task010-windows-runner.md"
      - "docs/task010-agent-upgrade-runbook.md"
      - ".github/workflows/task010-windows-validation.yml"

permissions:
  contents: read

jobs:
  windows-runtime-validation:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show runtime information
        shell: powershell
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          $PSVersionTable
          dotnet --info

      - name: Verify Task 010 validation files
        shell: powershell
        run: |
          if (-not (Test-Path ".\scripts\windows\task010-runtime-validation.ps1")) {
            throw "Missing scripts/windows/task010-runtime-validation.ps1"
          }

          if (-not (Test-Path ".\docs\task010-windows-runner.md")) {
            throw "Missing docs/task010-windows-runner.md"
          }

      - name: Verify dedicated Task 010 tests exist
        shell: powershell
        run: |
          if (-not (Get-ChildItem .\agent\Nexora.Agent.Tests -Recurse -Filter *.cs | Select-String -Pattern 'Task010_')) { throw "No Task010 acceptance tests found" }

      - name: Run Task 010 Windows runtime validation
        shell: powershell
        run: |
          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".\scripts\windows\task010-runtime-validation.ps1"

      # Remote Desktop V1. Kept as its own step so a failure here is
      # attributable and cannot be mistaken for a Remote Command regression.
      - name: Run Remote Desktop agent tests
        shell: powershell
        run: |
          dotnet clean ".\agent\Nexora.Agent.Tests\Nexora.Agent.Tests.csproj" `
            --configuration Release

          dotnet msbuild ".\agent\Nexora.Agent.Tests\Nexora.Agent.Tests.csproj" `
            /t:Compile `
            /p:Configuration=Release `
            /v:diag `
            *> ".\artifacts\task010-windows-validation\remote-desktop-msbuild-diag.log"

          dotnet test ".\agent\Nexora.Agent.Tests\Nexora.Agent.Tests.csproj" `
            --configuration Release `
            --filter "FullyQualifiedName~RemoteDesktop" `
            --logger "trx;LogFileName=remote-desktop-agent.trx" `
            --results-directory ".\artifacts\task010-windows-validation"

      - name: Verify Remote Desktop capability and isolation guard
        shell: powershell
        run: |
          $heartbeat = Get-Content ".\agent\Nexora.Agent\Services\HeartbeatService.cs" -Raw
          if ($heartbeat -notmatch 'remote_desktop_v1') { throw "Agent does not advertise remote_desktop_v1" }
          if ($heartbeat -notmatch 'remote_command_v1') { throw "Remote Command capability was dropped" }
          $service = Get-Content ".\agent\Nexora.Agent\Services\RemoteDesktopService.cs" -Raw
          # Nothing may listen on the endpoint; the channel is outbound only.
          foreach ($forbidden in @('HttpListener','TcpListener','WebSocketServer')) {
            if ($service -match [regex]::Escape($forbidden)) { throw "Agent must not listen: found $forbidden" }
          }
          Write-Host "Remote Desktop capability and outbound-only channel verified"

      - name: Publish Agent self-contained win-x64
        shell: powershell
        run: |
          dotnet publish `
            ".\agent\Nexora.Agent\Nexora.Agent.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ".\artifacts\nexora-agent-win-x64"

      - name: Validate Agent artifact
        shell: powershell
        run: |
          $exe = ".\artifacts\nexora-agent-win-x64\nexora-agent.exe"

          if (-not (Test-Path $exe)) {
            throw "nexora-agent.exe was not produced"
          }

          Get-Item $exe | Select-Object FullName, Length, LastWriteTime
          if (-not (Test-Path ".\artifacts\task010-windows-validation\task010-agent.trx")) { throw "Missing Task010 TRX" }
          if (-not (Select-String -Path ".\artifacts\task010-windows-validation\task010-agent.trx" -Pattern "Task010_")) { throw "TRX has no Task010 tests" }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task010-windows-validation
          path: |
            artifacts/
            task010-windows-validation.log
          if-no-files-found: warn
